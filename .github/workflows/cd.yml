name: CD pipeline test

on:
  workflow_run:
    workflows: ["CI pipeline"]
    types:
      - completed

jobs:
  deploy-canary:
    if: github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger backend canary deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_CANARY_DEPLOY_HOOK }}"

      - name: Wait for backend canary health
        run: |
          echo "Waiting 30 seconds before polling backend canary..."
          sleep 30

          RAW_BACKEND_URL="${{ secrets.BACKEND_CANARY_URL }}"
          if [ -z "$RAW_BACKEND_URL" ]; then
            echo "BACKEND_CANARY_URL secret is empty"
            exit 1
          fi

          if [[ "$RAW_BACKEND_URL" == */api/health ]]; then
            HEALTH_URL="$RAW_BACKEND_URL"
            echo "Using BACKEND_CANARY_URL as full health endpoint"
          else
            HEALTH_URL="${RAW_BACKEND_URL%/}/api/health"
            echo "Using BACKEND_CANARY_URL as base URL and appending /api/health"
          fi

          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

          for i in {1..60}; do
            STATUS=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.txt
              echo "Backend canary is healthy"
              exit 0
            fi

            sleep 10
          done

          echo "Backend canary failed health check"
          exit 1

      - name: Backend canary smoke test
        run: |
          curl -sS -D /tmp/backend_headers.txt -o /tmp/backend_body.json "$BACKEND_HEALTH_URL"

          # Verify health endpoint returns JSON and includes expected status field.
          grep -Eiq '^HTTP/.* 200' /tmp/backend_headers.txt
          grep -Eiq '^content-type: application/json' /tmp/backend_headers.txt
          grep -Eiq '"status"[[:space:]]*:[[:space:]]*"OK[[:space:]]*"' /tmp/backend_body.json

          # Verify auth route is mounted (expect any non-404 status, commonly 200/401/403).
          BASE_BACKEND_URL="${BACKEND_HEALTH_URL%/api/health}"
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_BACKEND_URL%/}/api/users/checkUserAuth" || true)
          echo "Auth route probe returned HTTP $AUTH_STATUS"
          if [ "$AUTH_STATUS" = "404" ] || [ "$AUTH_STATUS" = "000" ]; then
            echo "Expected /api/users/checkUserAuth to be reachable (not 404/000)"
            exit 1
          fi

      - name: Trigger frontend canary deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_CANARY_DEPLOY_HOOK }}"

      - name: Wait for frontend canary
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ secrets.FRONTEND_CANARY_URL }}/" > /dev/null; then
              echo "Frontend canary is available"
              exit 0
            fi
            echo "Waiting for frontend canary..."
            sleep 10
          done
          echo "Frontend canary failed availability check"
          exit 1

      - name: Frontend smoke test
        run: |
          FRONTEND_STATUS=$(curl -s -o frontend_canary.html -w "%{http_code}" "${{ secrets.FRONTEND_CANARY_URL }}/" || true)
          echo "Frontend homepage returned HTTP $FRONTEND_STATUS"
          [ "$FRONTEND_STATUS" = "200" ]
          test -s frontend_canary.html
          grep -q '<div id="root"></div>' frontend_canary.html
          grep -q '<title>FinWise</title>' frontend_canary.html

      - name: Integration smoke test (frontend origin to backend API)
        run: |
          FRONTEND_ORIGIN="${{ secrets.FRONTEND_CANARY_URL }}"
          BACKEND_BASE_URL="${BACKEND_HEALTH_URL%/api/health}"

          API_STATUS=$(curl -s -o /tmp/integration_health.json -w "%{http_code}" "${BACKEND_BASE_URL%/}/api/health" || true)
          echo "Integration API probe returned HTTP $API_STATUS"
          [ "$API_STATUS" = "200" ]

          curl -s -D /tmp/integration_cors_headers.txt -o /dev/null -X OPTIONS \
            -H "Origin: ${FRONTEND_ORIGIN%/}" \
            -H "Access-Control-Request-Method: GET" \
            "${BACKEND_BASE_URL%/}/api/health" || true

          ALLOW_ORIGIN=$(grep -Ei '^access-control-allow-origin:' /tmp/integration_cors_headers.txt | head -n1 | cut -d' ' -f2- | tr -d '\r')
          echo "CORS allow-origin returned: $ALLOW_ORIGIN"

          if [ -z "$ALLOW_ORIGIN" ]; then
            echo "Missing access-control-allow-origin header"
            exit 1
          fi

          if [ "$ALLOW_ORIGIN" != "*" ] && [ "$ALLOW_ORIGIN" != "${FRONTEND_ORIGIN%/}" ]; then
            echo "CORS allow-origin does not match frontend canary origin"
            exit 1
          fi

  promote-to-production:
    if: github.event.workflow_run.head_branch == 'main'
    needs: [deploy-canary]
    runs-on: ubuntu-latest
    steps:
      - name: Promote backend canary to production
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_PROD_DEPLOY_HOOK }}"

      - name: Promote frontend canary to production
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_PROD_DEPLOY_HOOK }}"
