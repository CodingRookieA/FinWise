name: CD pipeline test

on:
  push:
    branches:
      - deploy/cd

jobs:
  deploy-canary-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger backend canary deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_CANARY_DEPLOY_HOOK }}"

      - name: Wait for backend canary health
        run: |
          echo "Waiting 30 seconds before polling backend canary..."
          sleep 30

          RAW_BACKEND_URL="${{ secrets.BACKEND_CANARY_URL }}"
          if [ -z "$RAW_BACKEND_URL" ]; then
            echo "BACKEND_CANARY_URL secret is empty"
            exit 1
          fi

          if [[ "$RAW_BACKEND_URL" == */api/health ]]; then
            HEALTH_URL="$RAW_BACKEND_URL"
            echo "Using BACKEND_CANARY_URL as full health endpoint"
          else
            HEALTH_URL="${RAW_BACKEND_URL%/}/api/health"
            echo "Using BACKEND_CANARY_URL as base URL and appending /api/health"
          fi

          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

          for i in {1..60}; do
            STATUS=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.txt
              echo "Backend canary is healthy"
              exit 0
            fi

            sleep 10
          done

          echo "Backend canary failed health check"
          exit 1

      - name: Backend canary smoke test
        run: |
          RESPONSE=$(curl -fsS "$BACKEND_HEALTH_URL")
          echo "$RESPONSE" | grep -Ei "ok|healthy|success"

      - name: Trigger frontend canary deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_CANARY_DEPLOY_HOOK }}"

      - name: Wait for frontend canary
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ secrets.FRONTEND_CANARY_URL }}/" > /dev/null; then
              echo "Frontend canary is available"
              exit 0
            fi
            echo "Waiting for frontend canary..."
            sleep 10
          done
          echo "Frontend canary failed availability check"
          exit 1

      - name: Frontend smoke test
        run: |
          curl -fsS "${{ secrets.FRONTEND_CANARY_URL }}/" > frontend_canary.html
          test -s frontend_canary.html
