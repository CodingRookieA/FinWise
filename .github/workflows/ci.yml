name: CI pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # --- 1. CODE QUALITY CHECKS (LINTING) ---
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Lint Client
        run: |
          cd client
          npm ci
          npm run lint

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Lint Server
        run: |
          cd server
          npm ci
          npm run lint

  # --- 2. UNIT TESTING ---
  test-frontend:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Test Client
        env:
          VITE_SERVER_URL_DEVELOPMENT: http://localhost:9000
        run: |
          cd client
          npm ci
          npm run test:unit

  test-backend:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Test Server
        run: |
          cd server
          npm ci
          npm run test:unit

  # --- 3. SECURITY SCAN ---
  security-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend Security Audit
        run: |
          cd client
          npm audit --audit-level=moderate

  security-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend Security Audit
        run: |
          cd server
          npm audit --audit-level=moderate

  # --- 4. CONTAINER BUILD (any branch push; runs after all upstream jobs) ---
  docker-build-push:
    needs: [lint-frontend, lint-backend, test-frontend, test-backend, security-frontend, security-backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write client/.env for Vite build (not in repo; same shape as local)
        env:
          VITE_OAUTH_CLIENT_ID: ${{ secrets.VITE_OAUTH_CLIENT_ID }}
        run: |
          {
            echo "VITE_SERVER_URL=http://localhost:9000"
            echo "VITE_SERVER_URL_DEVELOPMENT=http://localhost:9000"
            echo "VITE_CHAT_RESPONSE_MODE=streaming"
            echo "VITE_OAUTH_CLIENT_ID=${VITE_OAUTH_CLIENT_ID:-}"
          } > client/.env

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.USERNAME }}/finwise-frontend:${{ github.ref == 'refs/heads/main' && 'latest' || github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.USERNAME }}/finwise-backend:${{ github.ref == 'refs/heads/main' && 'latest' || github.sha }}
